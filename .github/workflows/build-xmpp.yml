name: "XMPP CI Build"

on:
  pull_request: { }
  push:
    branches: [ feat/xmpp-support ]

permissions:
  contents: read
  actions: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" -Dkotlin.incremental=false
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --warn --no-build-cache -PpreDexEnable=false --max-workers 1 --no-daemon -PminifyEnabled=false -PallWarningsAsErrors=false -PciAbi=armeabi-v7a -PpcpXmpp=true

jobs:
  build-xmpp:
    name: Build Fdroid with XMPP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Assemble Fdroid debug apk (with XMPP)
        run: ./gradlew assembleFdroidDebug $CI_GRADLE_ARG_PROPERTIES
      - name: Upload Fdroid APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: pcp-fdroid-debug-xmpp
          path: |
            vector-app/build/outputs/apk/fdroid/debug/*.apk
